aid: optoscale
name: Optoscale
description: Optoscale (OptoScale AS) is a Norwegian aquaculture technology company founded
  in 2015 in Trondheim that builds AI-powered, camera-based edge-computing monitoring for
  fish farming. Its Bioscope units capture real-time measurements of fish weight, biomass,
  sea-lice counts, welfare, behaviour and feeding, producing tens of thousands of validated
  measurements each day directly on the unit rather than on remote servers. Customers view
  trends, graphs and high-resolution imagery through the OptoScale web portal, export to
  Excel/CSV, and integrate the underlying data into their own analytics and farm-management
  systems via OptoScale's data API. OptoScale was acquired by Insight Partners in 2025.
